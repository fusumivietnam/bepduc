name: Feature
about: Plan a scoped product or engineering change
title: "[FEATURE] "
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem or user need are we solving?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included in this issue?
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Explicitly list nearby work that is not part of this issue.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: input
    id: design
    attributes:
      label: Design / reference
      description: Mockup, issue, document or URL when applicable.
