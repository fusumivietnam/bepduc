name: Catalogue UI integration

on:
  pull_request:
    paths:
      - 'wp-content/themes/bepduc/**'
      - '.github/workflows/catalogue-ui.yml'
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/bepduc/**'
      - '.github/workflows/catalogue-ui.yml'

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare PHP + locked dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install public WooCommerce package and WP-CLI
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp

      - name: Install WP + activate Bepduc theme and Woo
        run: |
          wp core download --path=/tmp/wordpress --allow-root
          wp config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check --allow-root
          wp config set WP_ENVIRONMENT_TYPE local --type=constant --path=/tmp/wordpress --allow-root
          wp core install --path=/tmp/wordpress --url=http://localhost:8017 --title='Catalogue UI test' --admin_user=admin --admin_password='ci-test-only' --admin_email=devnull@example.com --skip-email --allow-root
          cp -R wp-content/plugins/bepduc-core /tmp/wordpress/wp-content/plugins/bepduc-core
          cp -R wp-content/plugins/woocommerce /tmp/wordpress/wp-content/plugins/woocommerce
          cp -R wp-content/themes/bepduc /tmp/wordpress/wp-content/themes/bepduc
          wp plugin activate woocommerce bepduc-core --path=/tmp/wordpress --allow-root
          wp theme activate bepduc --path=/tmp/wordpress --allow-root
          wp rewrite structure '/%postname%/' --path=/tmp/wordpress --allow-root
          SHOP_ID="$(wp post create --post_type=page --post_status=publish --post_title=Shop --porcelain --path=/tmp/wordpress --allow-root)"
          wp option update woocommerce_shop_page_id "$SHOP_ID" --path=/tmp/wordpress --allow-root
          wp rewrite flush --hard --path=/tmp/wordpress --allow-root
          wp option update woocommerce_currency VND --path=/tmp/wordpress --allow-root
          wp bepduc catalog sync --path=/tmp/wordpress --allow-root
          wp bepduc seed products --path=/tmp/wordpress --allow-root
          wp post create --post_type=page --post_status=publish --post_title='So sánh' --post_name=so-sanh --path=/tmp/wordpress --allow-root
          wp post create --post_type=page --post_status=publish --post_title=Advisor --post_name=tu-van-chon-bep --path=/tmp/wordpress --allow-root

      - name: Verify registered blocks, patterns and theme templates
        run: |
          wp eval '
            $registry = WP_Block_Type_Registry::get_instance();
            foreach ([
                "bepduc/product-brand",
                "core/query",
                "core/post-template",
                "woocommerce/product-image",
                "woocommerce/product-sale-badge",
                "woocommerce/product-price",
                "woocommerce/product-stock-indicator",
                "woocommerce/product-button",
                "bepduc/catalogue-controls",
            ] as $name) {
                if (!$registry->is_registered($name)) {
                    WP_CLI::error("Missing block: " . $name);
                }
            }
            foreach (["bepduc/product-card", "bepduc/catalogue-results"] as $pattern) {
                if (!WP_Block_Patterns_Registry::get_instance()->is_registered($pattern)) {
                    WP_CLI::error("Missing reusable theme pattern " . $pattern);
                }
            }
            foreach (["archive-product", "page-shop", "taxonomy-product_cat", "taxonomy-product_brand"] as $slug) {
                $template = get_block_template("bepduc//" . $slug, "wp_template");
                if (!$template || strpos($template->content, "bepduc/catalogue-results") === false) {
                    WP_CLI::error("Missing catalogue template or card pattern: " . $slug);
                }
            }
            $resultPattern = WP_Block_Patterns_Registry::get_instance()->get_registered("bepduc/catalogue-results");
            if (strpos($resultPattern["content"], "bepduc/catalogue-controls") === false
                || strpos($resultPattern["content"], "bd-product-card") === false) {
                WP_CLI::error("Shared results pattern has missing native blocks");
            }
            $id = wc_get_product_id_by_sku("BD-DEMO-002");
            $parsed = parse_blocks("<!-- wp:bepduc/product-brand /-->");
            $brand = new WP_Block($parsed[0], ["postId" => $id, "postType" => "product"]);
            $html = $brand->render();
            if (strpos($html, "Demo Studio") === false || strpos($html, "rel=\"tag\"") === false) {
                WP_CLI::error("Native product brand is not rendering with correct post context");
            }
            WP_CLI::success("All Woo blocks/templates and brand context are registered.");
          ' --path=/tmp/wordpress --allow-root

      - name: Verify product detail blocks and template
        run: |
          wp eval '
            foreach (["woocommerce/product-image-gallery", "woocommerce/add-to-cart-form", "woocommerce/product-details", "bepduc/product-specifications", "bepduc/installation-guidance"] as $name) {
              if (!WP_Block_Type_Registry::get_instance()->is_registered($name)) { WP_CLI::error("Missing product block: " . $name); }
            }
            $template = get_block_template("bepduc//single-product", "wp_template");
            if (!$template || strpos($template->content, "woocommerce/add-to-cart-form") === false) {
              WP_CLI::error("Single product template missing");
            }
            foreach (["BD-DEMO-002", "BD-DEMO-024"] as $sku) {
              $id = wc_get_product_id_by_sku($sku);
              $product = wc_get_product($id);
              if (!$product) { WP_CLI::error("Missing product " . $sku); }
            }
          ' --path=/tmp/wordpress --allow-root

      - name: Verify editorial advice metadata lifecycle
        run: |
          wp eval '
            $fields = \Bepduc\Core\Advisor\ProductFields::FIELDS;
            foreach (array_keys($fields) as $key) {
              if (!registered_meta_key_exists("post", "_".$key, "product")) { WP_CLI::error("Unregistered advisor meta: " . $key); }
            }
            $product = wc_get_product(wc_get_product_id_by_sku("BD-DEMO-002"));
            $product->update_meta_data("_bd_buying_advice", "Đã kiểm chứng trên tài liệu");
            $product->save();
            if (\Bepduc\Core\Advisor\ProductFields::published($product) !== []) {
              WP_CLI::error("Unsourced advice is visible");
            }
            $product->update_meta_data("_bd_source_reference", "Tài liệu mẫu CI-01");
            $product->save();
            $output = \Bepduc\Core\Advisor\ProductFields::published($product);
            if (count($output) !== 1 || reset($output) !== "Đã kiểm chứng trên tài liệu") {
              WP_CLI::error("Verified editorial advice not available");
            }
          ' --path=/tmp/wordpress --allow-root

      - name: Serve shop archive and check actual frontend rendering
        run: |
          set -euo pipefail
          wp server --host=127.0.0.1 --port=8017 --path=/tmp/wordpress --allow-root > /tmp/wp-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8017/shop/ -o /tmp/shop.html; then
              break
            fi
            sleep 1
          done
          if [[ ! -s /tmp/shop.html ]]; then
            cat /tmp/wp-serve.log
            exit 1
          fi
          echo "Shop HTTP response length: $(wc -c < /tmp/shop.html)"
          echo 'Shop diagnostics:'
          python3 - <<'PY'
          source = open('/tmp/shop.html', encoding='utf-8').read()
          for marker in ['bd-catalogue-page', 'bd-catalogue-layout', 'bd-catalogue-collection',
                         'wp-block-query', 'bd-product-card', 'bd-catalogue-toolbar',
                         'bd-catalogue-form', '[DEMO]', 'Không tìm thấy sản phẩm']:
              index = source.find(marker)
              print(f"{marker}: count={source.count(marker)} first={index}")
              if index >= 0:
                  print(source[max(0, index-160):index+220].replace('\\n', ' ')[:400])
          print('Catalogue result markup after toolbar:')
          idx = source.find('bd-catalogue-toolbar')
          print(source[idx+500:idx+3600].replace('\\n', ' ') if idx >= 0 else 'NO TOOLBAR')
          PY
          grep -Eo '<title[^>]*>[^<]+|<main[^>]*>|<h1[^>]*>[^<]+|bd-product-card|bd-catalogue-page|woocommerce-product-collection|catalogue.css' /tmp/shop.html | head -n 35 || true
          for expected in 'bd-catalogue-page' 'bd-product-card' 'bd-catalogue-collection' 'catalogue.css' 'Demo'; do
            if ! grep -q "$expected" /tmp/shop.html; then
              echo "Missing frontend marker: $expected"
              head -c 3200 /tmp/shop.html
              exit 1
            fi
          done
          curl -fsSG --data-urlencode 'bd_brand=demo-atelier' http://127.0.0.1:8017/shop/ -o /tmp/brand.html
          curl -fsSG --data-urlencode 'bd_stock=outofstock' http://127.0.0.1:8017/shop/ -o /tmp/stock.html
          curl -fsSG --data-urlencode 'bd_min=100000000' http://127.0.0.1:8017/shop/ -o /tmp/min-price.html
          curl -fsSG --data-urlencode 'bd_sort=price-desc' http://127.0.0.1:8017/shop/ -o /tmp/sort.html
          for file in /tmp/brand.html /tmp/stock.html /tmp/min-price.html /tmp/sort.html; do
            echo "$file: cards=$(grep -o 'bd-product-card' "$file" | wc -l) atelier=$(grep -o 'product_brand-demo-atelier' "$file" | wc -l) studio=$(grep -o 'product_brand-demo-studio' "$file" | wc -l)"
          done
          grep -q 'product_brand-demo-atelier' /tmp/brand.html
          if grep -q 'product_brand-demo-studio' /tmp/brand.html; then exit 1; fi
          grep -q 'outofstock' /tmp/stock.html
          if grep -q 'bd-product-card' /tmp/min-price.html; then exit 1; fi
          grep -q 'bd-product-card' /tmp/sort.html
          SIMPLE_SLUG="$(wp post get "$(wp eval 'echo wc_get_product_id_by_sku("BD-DEMO-002");' --path=/tmp/wordpress --allow-root)" --field=post_name --path=/tmp/wordpress --allow-root)"
          VARIABLE_SLUG="$(wp post get "$(wp eval 'echo wc_get_product_id_by_sku("BD-DEMO-024");' --path=/tmp/wordpress --allow-root)" --field=post_name --path=/tmp/wordpress --allow-root)"
          curl -fsS "http://127.0.0.1:8017/product/$SIMPLE_SLUG/" -o /tmp/product-simple.html
          curl -fsS "http://127.0.0.1:8017/product/$VARIABLE_SLUG/" -o /tmp/product-variable.html
          for file in /tmp/product-simple.html /tmp/product-variable.html; do
            grep -q 'bd-product-detail' "$file"
            grep -q 'bd-product-specifications' "$file"
            grep -q 'bd-product-installation' "$file"
            grep -q 'product-detail.css' "$file"
            grep -q 'add-to-cart' "$file"
            if grep -q 'Fatal error' "$file"; then exit 1; fi
          done
          grep -q 'variation' /tmp/product-variable.html
          grep -q 'Studio' /tmp/product-simple.html
          grep -q 'Đã kiểm chứng trên tài liệu' /tmp/product-simple.html
          if grep -q 'Tài liệu mẫu CI-01' /tmp/product-simple.html; then echo 'Source reference leaked into public content'; exit 1; fi
          # Product comparison uses only public product IDs and an anonymous GET URL.
          ID1="$(wp eval 'echo wc_get_product_id_by_sku("BD-DEMO-002");' --path=/tmp/wordpress --allow-root)"
          ID2="$(wp eval 'echo wc_get_product_id_by_sku("BD-DEMO-006");' --path=/tmp/wordpress --allow-root)"
          IDVAR="$(wp eval 'echo wc_get_product_id_by_sku("BD-DEMO-024");' --path=/tmp/wordpress --allow-root)"
          curl -fsS http://127.0.0.1:8017/so-sanh/ -o /tmp/compare-empty.html
          grep -q 'Chọn ít nhất hai sản phẩm' /tmp/compare-empty.html
          curl -fsSG --data-urlencode "bd_compare=$ID1,$ID2" http://127.0.0.1:8017/so-sanh/ -o /tmp/compare-two.html
          grep -q 'bd-compare__scroll' /tmp/compare-two.html
          grep -q 'Tình trạng' /tmp/compare-two.html
          grep -q 'Thông số' /tmp/compare-two.html || grep -q 'Dòng sản phẩm' /tmp/compare-two.html
          curl -fsSG --data-urlencode "bd_compare=$ID1,$IDVAR" http://127.0.0.1:8017/so-sanh/ -o /tmp/compare-variable.html
          grep -q 'bd-compare__scroll' /tmp/compare-variable.html
          curl -fsSG --data-urlencode "bd_compare=1,999999999" http://127.0.0.1:8017/so-sanh/ -o /tmp/compare-invalid.html
          if grep -q 'bd-compare__scroll' /tmp/compare-invalid.html; then echo 'Invalid IDs included'; exit 1; fi
          curl -fsSG --data-urlencode "bd_compare=$ID1" http://127.0.0.1:8017/so-sanh/ -o /tmp/compare-one.html
          if grep -q 'bd-compare__scroll' /tmp/compare-one.html; then echo 'Single product unexpectedly compared'; exit 1; fi
          curl -fsS -D /tmp/compare-headers -o /dev/null -G --data-urlencode "bd_product[]=$ID1" --data-urlencode "bd_product[]=$ID2" http://127.0.0.1:8017/so-sanh/
          grep -q '303 See Other' /tmp/compare-headers
          grep -q 'So sánh sản phẩm này' /tmp/product-simple.html
          grep -q 'product-compare.css' /tmp/compare-two.html
          curl -fsS http://127.0.0.1:8017/tu-van-chon-bep/ -o /tmp/advisor-empty.html
          grep -q 'Chọn ít nhất một tiêu chí' /tmp/advisor-empty.html
          curl -fsSG --data-urlencode 'bd_category=bep-tu' http://127.0.0.1:8017/tu-van-chon-bep/ -o /tmp/advisor-category.html
          grep -q 'bd-advisor__result' /tmp/advisor-category.html
          curl -fsSG --data-urlencode 'bd_budget=1' http://127.0.0.1:8017/tu-van-chon-bep/ -o /tmp/advisor-budget.html
          grep -q 'Không tìm thấy sản phẩm' /tmp/advisor-budget.html
          ! grep -q 'bd-advisor__result' /tmp/advisor-budget.html
          if grep -q 'Fatal error' /tmp/shop.html; then
            echo 'Fatal PHP error on shop page'
            exit 1
          fi
