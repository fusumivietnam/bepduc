name: Validate GitHub Project bootstrap

on:
  pull_request:
    paths:
      - 'scripts/github/**'
      - '.github/workflows/project-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/github/**'
      - '.github/workflows/project-bootstrap.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n scripts/github/bootstrap-project.sh
      - name: ShellCheck
        run: shellcheck -S warning scripts/github/bootstrap-project.sh
