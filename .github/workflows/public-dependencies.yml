name: Validate public plugin dependencies

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'composer.json'
      - 'composer.lock'
      - 'scripts/public-plugins/**'
      - '.github/workflows/public-dependencies.yml'
  push:
    branches:
      - main
    paths:
      - 'composer.json'
      - 'composer.lock'
      - 'scripts/public-plugins/**'
      - '.github/workflows/public-dependencies.yml'

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Require committed lock file
        run: test -f composer.lock

      - name: Install public plugins from lock
        run: bash scripts/public-plugins/install.sh

      - name: Verify versions, lock and Git boundaries
        run: bash scripts/public-plugins/verify.sh

      - name: Verify expected WordPress plugin entrypoints
        run: |
          test -f wp-content/plugins/woocommerce/woocommerce.php
          test -f wp-content/plugins/seo-by-rank-math/rank-math.php
          test -f wp-content/plugins/fluent-smtp/fluent-smtp.php
